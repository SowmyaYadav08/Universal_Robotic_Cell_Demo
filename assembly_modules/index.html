<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assembly Recovery Monitor</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#edf3f8;color:#21374b}header{background:linear-gradient(110deg,#095d77,#286c87,#67539d);color:white;padding:18px 28px}header h1{font-size:26px;margin:0 0 6px}header p{margin:0;font-size:14px;color:#e4edf8}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:white;padding:14px 28px;box-shadow:0 3px 12px #18394e12}label{font-weight:650}select,button{font:inherit;padding:9px 12px;border:1px solid #bdd2df;border-radius:7px;background:#eef6fa;color:#164e65;cursor:pointer}select{min-width:200px}button:hover{background:#d9edf3}select:focus,button:focus-visible,a:focus-visible{outline:3px solid #80afd6;outline-offset:3px}details{position:relative}summary{cursor:pointer;color:#006a79;font-weight:650;padding:10px}.menu{position:absolute;z-index:10;top:42px;left:0;background:white;min-width:285px;border:1px solid #dce5ed;border-radius:10px;box-shadow:0 8px 24px #17344a24;padding:8px}.menu button,.menu a,.menu span{display:block;width:100%;text-align:left;text-decoration:none;padding:10px;border:0;background:white;color:#155c71}.menu button:hover,.menu a:hover{background:#e8f3f8}.menu span{color:#7a8798;cursor:default;font-size:14px}#description{flex:1;color:#5c7188;font-size:14px}.view{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 28px;font-size:14px}#content{display:block;width:calc(100% - 32px);height:calc(100dvh - 210px);min-height:480px;margin:0 16px 16px;border:1px solid #dbe5ed;border-radius:12px;background:white}#empty{margin:20px;padding:25px;background:white;border-radius:12px}a{color:#006a79}@media(max-width:700px){header,.toolbar{padding:14px}#description{flex-basis:100%}.view{padding:10px 16px}#content{height:70vh}.menu{left:auto;right:0}}</style>
<header><h1>Assembly Recovery Monitor</h1><p>One workspace for three independent module demonstrations · Synthetic cases, not live factory status</p></header>
<div class="toolbar"><label for="module">Module</label><select id="module" aria-label="Select assembly module"></select><button id="monitor">Monitor</button><details id="reportMenu"><summary>Reports &amp; demo</summary><div class="menu" id="reportLinks"></div></details><span id="description"></span></div>
<div class="view"><strong id="viewName" aria-live="polite"></strong><a id="openSeparate" target="_blank" rel="noopener">Open this view in a new tab</a></div>
<p id="empty" hidden></p><iframe id="content" title="Selected module monitor"></iframe>
<noscript>This module selector needs local browser JavaScript. Open each module's outputs/dashboard.html directly instead.</noscript>
<script>const modules=[{"id":"light_localizer","name":"Light Localizer","description":"Plate stacking and replacement simulation","dashboard":"light_localizer/outputs/dashboard.html","reports":[{"name":"Assembly Video Findings","path":"../recovery_demo/outputs/real_video_review/review.html","kind":"page","available":true},{"name":"Recovery Decision Report","path":"../recovery_demo/outputs/video_alert_replay/replay.html","kind":"page","available":true},{"name":"Plate Replacement Playback","path":"light_localizer/outputs/recovery_playback.html","kind":"page","available":true},{"name":"Assembly Event Log (CSV)","path":"light_localizer/outputs/events.csv","kind":"download","available":true},{"name":"Scenario Results (JSON)","path":"light_localizer/outputs/results.json","kind":"download","available":true}],"available":true},{"id":"prefilter","name":"Prefilter","description":"Bearing pickup and pressing. Simulated cases and recorded video previews.","dashboard":"prefilter/outputs/dashboard.html","reports":[{"name":"Prefilter Video Library","path":"prefilter/outputs/video_library/library.html","kind":"page","available":true},{"name":"Assembly Event Log (CSV)","path":"prefilter/outputs/events.csv","kind":"download","available":true},{"name":"Scenario Results (JSON)","path":"prefilter/outputs/results.json","kind":"download","available":true},{"name":"Recovery Demo (not implemented)","path":null,"kind":"page","available":false}],"available":true},{"id":"tube_interface","name":"Tube Interface","description":"Component handling and screwing. Simulated cases and recorded video previews.","dashboard":"tube_interface/outputs/dashboard.html","reports":[{"name":"Tube Interface Video Library","path":"tube_interface/outputs/video_library/library.html","kind":"page","available":true},{"name":"Assembly Event Log (CSV)","path":"tube_interface/outputs/events.csv","kind":"download","available":true},{"name":"Scenario Results (JSON)","path":"tube_interface/outputs/results.json","kind":"download","available":true},{"name":"Recovery Demo (not implemented)","path":null,"kind":"page","available":false}],"available":true}];const get=id=>document.getElementById(id);let active;
modules.forEach(m=>{const option=document.createElement('option');option.value=m.id;option.textContent=m.name;get('module').appendChild(option);});
function openView(path,name,ready){get('viewName').textContent=active.name+' / '+name;get('content').title=active.name+' '+name;get('empty').hidden=ready;get('content').hidden=!ready;get('openSeparate').hidden=!ready;if(!ready){get('content').removeAttribute('src');get('empty').textContent='This report has not been generated. Run python assembly_modules/run_all.py --previews, then reopen this page.';return;}const destination=path+(path.includes('?')?'&':'?')+'embedded=1';get('content').src=destination;get('openSeparate').href=path;get('reportMenu').open=false;}
function choose(id){active=modules.find(m=>m.id===id)||modules[0];get('module').value=active.id;history.replaceState(null,'','#'+active.id);get('description').textContent=active.description;get('reportLinks').replaceChildren();active.reports.forEach(r=>{let item;if(!r.path||!r.available){item=document.createElement('span');item.textContent=r.name+(!r.path?'':' — not generated');}else if(r.kind==='download'){item=document.createElement('a');item.href=r.path;item.download='';item.textContent=r.name;}else{item=document.createElement('button');item.textContent=r.name;item.onclick=()=>openView(r.path,r.name,r.available);}get('reportLinks').appendChild(item);});openView(active.dashboard,'Monitor',active.available);}
get('module').onchange=()=>choose(get('module').value);get('monitor').onclick=()=>openView(active.dashboard,'Monitor',active.available);window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));choose(location.hash.slice(1));</script></html>
